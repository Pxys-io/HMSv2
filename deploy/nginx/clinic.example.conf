# HMSv2 — public site (clinic.example)
server {
    listen 80;
    server_name clinic.example;

    root /var/www/hmsv2/public;
    index index.html;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.clinic.example; img-src 'self' data: https://api.clinic.example; font-src 'self' data:; style-src 'self' 'unsafe-inline'" always;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # The SPA talks to the API via relative /api/... (Plan/11 §2)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
