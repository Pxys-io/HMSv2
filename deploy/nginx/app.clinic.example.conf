# HMSv2 — staff app (app.clinic.example)
server {
    listen 80;
    server_name app.clinic.example;

    root /var/www/hmsv2/staff;
    index index.html;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.clinic.example; img-src 'self' data: https://api.clinic.example; font-src 'self' data:; style-src 'self' 'unsafe-inline'" always;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # PWA
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
